# Production and staging topology (TASK-058, deployment.md): proxy, api, worker, beat, db, redis.
#
#   docker compose --env-file .env.production -f infra/compose.production.yml pull --ignore-buildable
#   docker compose --env-file .env.production -f infra/compose.production.yml run --rm api python manage.py migrate --noinput
#   docker compose --env-file .env.production -f infra/compose.production.yml up -d
#
# Copy infra/production.env.example to .env.production (outside source control, readable only by the
# deployment account). With APP_IMAGE and WEB_IMAGE set to released tags the host pulls them; without, the
# images are built here, which is for trying the stack locally, not for a memory-constrained server.
# Only the proxy publishes ports. The database and Redis are on the private network.
name: ${COMPOSE_PROJECT_NAME:-mombasa-tt-production}

x-api-build: &api-build
  context: ../services/api
  dockerfile: Dockerfile.production

x-app-env: &app-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${APP_DOMAIN}}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://${APP_DOMAIN}}
  FRONTEND_URL: ${FRONTEND_URL:-https://${APP_DOMAIN}}
  DATABASE_URL: postgres://mombasa:${POSTGRES_PASSWORD}@db:5432/mombasa_tt
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Coast TT <no-reply@localhost>}
  ATTACHMENT_URL_TTL: ${ATTACHMENT_URL_TTL:-300}
  MIN_CLIENT_BUILD: ${MIN_CLIENT_BUILD:-0}
  SODA_STAKES_ENABLED: ${SODA_STAKES_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  image: ${APP_IMAGE:-mombasa-tt-api:local}
  build: *api-build
  restart: unless-stopped
  environment: *app-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  proxy:
    image: ${WEB_IMAGE:-mombasa-tt-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.production
      additional_contexts:
        api: service:api
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        APP_BUILD: ${APP_BUILD:-}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and the ACME account: keep them, or a restart asks the CA again and can hit its limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    volumes:
      # Private attachments while storage is the local filesystem; never served by the proxy.
      - attachments-data:/var/lib/mombasa-tt/attachments
    healthcheck:
      # Django checks the Host header, so ask as the site itself.
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/live', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Does the outbox's jobs (REQ-015). SIGTERM is a warm shutdown: running tasks finish within the grace period.
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel", "INFO", "--concurrency", "${WORKER_CONCURRENCY:-2}"]
    stop_grace_period: 60s

  # Exactly one.
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mombasa_tt
      POSTGRES_USER: mombasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mombasa -d mombasa_tt"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wake-ups and WebSocket messages only: the work itself stays in PostgreSQL, so nothing here needs a disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  attachments-data:
  caddy-data:
  caddy-config:
