# Release gate for every PR into dev and main (TASK-008). Each job must pass before a branch can merge;
# require these checks in the branch protection rules for dev and main.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, migrations, schema, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mombasa_tt
          POSTGRES_USER: mombasa
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mombasa -d mombasa_tt"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://mombasa:ci-only@127.0.0.1:5432/mombasa_tt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migration drift
        run: uv run manage.py makemigrations --check --dry-run
      - name: OpenAPI schema drift
        run: |
          uv run manage.py spectacular --fail-on-warn --file openapi.yaml
          git diff --exit-code -- openapi.yaml || { echo "::error::openapi.yaml is stale; regenerate it (see README)"; exit 1; }
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: uv export --locked --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt && uvx pip-audit --strict --no-deps --disable-pip -r /tmp/requirements.txt

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types drift
        run: |
          pnpm gen:api
          git diff --exit-code -- ../../packages/contracts || { echo "::error::packages/contracts is stale; run pnpm gen:api"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Scoring reducer (types, shared fixtures, parity file drift)
        run: |
          pnpm typecheck:scoring
          pnpm test:scoring
          pnpm gen:parity
          git diff --exit-code -- ../../packages/scoring/fixtures || { echo "::error::packages/scoring/fixtures/parity.json is stale; run pnpm gen:parity"; exit 1; }
      - name: Score journal and deck session (types, offline and restart tests)
        run: |
          pnpm typecheck:deck
          pnpm test:deck
      - name: Typecheck and build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  images:
    name: Images (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production images (TASK-058)
        # Only the required variables, with placeholder values: this builds, it never runs or publishes.
        env:
          APP_DOMAIN: ci.invalid
          DJANGO_SECRET_KEY: build-only
          POSTGRES_PASSWORD: build-only
          REDIS_PASSWORD: build-only
        run: docker compose -f infra/compose.production.yml build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
