# Release gate for every PR into dev and main (TASK-008). Each job must pass before a branch can merge;
# require these checks in the branch protection rules for dev and main.
#
# Kept cheap (Actions minutes are billed per job, rounded up to the minute):
# - only pull requests run it, except a merge into dev, which runs the API tests once in full: that run
#   records which code each test executes (pytest-testmon) and caches it, so a pull request then runs
#   only the tests whose code it changed. A change testmon can't trace (migrations, settings, test
#   setup, dependencies, data files, this file) runs every test.
# - the release PR from dev into main skips the jobs: the same commits passed on their way into dev.
#   Skipped jobs count as passed for required checks.
# - each job runs only when files it checks changed; a docs-only PR runs the secret scan alone.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      # Every test, not only those testmon picks: a merge into dev (the baseline), a manual run, or
      # a change whose effect on the tests can't be traced through the code they execute.
      api_full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api_full == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      images: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.images == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/scoring/fixtures/**'
              - '.github/workflows/ci.yml'
            api_full:
              - 'services/api/**/migrations/**'
              - 'services/api/config/**'
              - 'services/api/**/conftest.py'
              - 'services/api/tests/helpers.py'
              - 'services/api/pyproject.toml'
              - 'services/api/uv.lock'
              - 'services/api/**/*.{html,txt,json,svg,ttf,otf,woff,woff2,png,jpg,css,csv,xml}'
              - 'packages/scoring/fixtures/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'services/api/openapi.yaml'
              - '.github/workflows/ci.yml'
            images:
              - '**/Dockerfile*'
              - 'infra/**'
              - 'services/api/pyproject.toml'
              - 'services/api/uv.lock'
              - 'apps/web/package.json'
              - 'apps/web/pnpm-lock.yaml'
              - 'apps/web/vite.config.*'
              - '.github/workflows/ci.yml'

  api:
    name: API (lint, migrations, schema, tests)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mombasa_tt
          POSTGRES_USER: mombasa
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mombasa -d mombasa_tt"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://mombasa:ci-only@127.0.0.1:5432/mombasa_tt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --locked
      # The test database is thrown away with the runner: skip writing it safely to disk. Almost every
      # test writes, so this alone takes a good part off the run.
      - name: Fast throwaway database
        env:
          PGPASSWORD: ci-only
        run: |
          psql -h 127.0.0.1 -U mombasa -d mombasa_tt -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migration drift
        run: uv run manage.py makemigrations --check --dry-run
      - name: OpenAPI schema drift
        run: |
          uv run manage.py spectacular --fail-on-warn --file openapi.yaml
          git diff --exit-code -- openapi.yaml || { echo "::error::openapi.yaml is stale; regenerate it (see README)"; exit 1; }
      # A pull request starts from the record of the last full run on dev (caches made on dev are
      # readable by pull requests into dev).
      - name: Restore which code each test runs
        if: github.event_name == 'pull_request' && needs.changes.outputs.api_full != 'true'
        uses: actions/cache/restore@v4
        with:
          path: services/api/.testmondata
          key: testmon-${{ github.sha }}
          restore-keys: testmon-
      - name: Tests
        # In parallel, each worker with its own test database (pytest-django names them _gw0, _gw1...).
        # The tests mostly wait on the database, so more workers than cores still pays; worksteal moves
        # tests to idle workers so one long file (the privacy matrix) doesn't hold up the end.
        # --testmon runs only the tests whose code changed since the record (all of them without one);
        # --testmon-noselect runs every test and records afresh. Exit code 5 is "nothing to run".
        env:
          SELECT: ${{ needs.changes.outputs.api_full == 'true' && '--testmon-noselect' || '--testmon' }}
        run: uv run pytest -n 4 --dist worksteal $SELECT || [ $? -eq 5 ]
        timeout-minutes: 15
      - name: Keep the record for pull requests
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: services/api/.testmondata
          key: testmon-${{ github.sha }}
      - name: Dependency audit
        run: uv export --locked --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt && uvx pip-audit --strict --no-deps --disable-pip -r /tmp/requirements.txt

  web:
    name: Web (lint, types, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types drift
        run: |
          pnpm gen:api
          git diff --exit-code -- ../../packages/contracts || { echo "::error::packages/contracts is stale; run pnpm gen:api"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Scoring reducer (types, shared fixtures, parity file drift)
        run: |
          pnpm typecheck:scoring
          pnpm test:scoring
          pnpm gen:parity
          git diff --exit-code -- ../../packages/scoring/fixtures || { echo "::error::packages/scoring/fixtures/parity.json is stale; run pnpm gen:parity"; exit 1; }
      - name: Score journal and deck session (types, offline and restart tests)
        run: |
          pnpm typecheck:deck
          pnpm test:deck
      - name: Changes kept offline (send order, retries, accounts, storage failures)
        run: pnpm test:offline
      - name: Live views carry no umpire controls
        run: pnpm test:live
      - name: Form draft tests
        run: pnpm test:drafts
      - name: Staying signed in offline
        run: pnpm test:session
      - name: Typecheck and build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  images:
    name: Images (production build)
    # Only when what goes into an image changes; every merge to main builds them anyway.
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production images (TASK-058)
        # Only the required variables, with placeholder values: this builds, it never runs or publishes.
        env:
          APP_DOMAIN: ci.invalid
          DJANGO_SECRET_KEY: build-only
          POSTGRES_PASSWORD: build-only
          REDIS_PASSWORD: build-only
        run: docker compose -f infra/compose.production.yml build

  secrets:
    name: Secret scan
    # A merge into dev was scanned as a pull request already.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref != 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
