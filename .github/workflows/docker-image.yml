# Builds the two production images and pushes them to GHCR. The VPS only pulls them
# (vps-ansible-deploy: mombasa-tt/deploy.yml), so nothing is compiled on the server.
name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mombasa-tt-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mombasa-tt-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web release's number (deployment.md, APP_BUILD): YYYYMMDDHHMM.
      - name: Release number
        id: release
        run: echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=mombasa-tt-api
          cache-to: type=gha,scope=mombasa-tt-api,mode=max

      # The web image copies Django's collected static files out of the API image just pushed.
      # VITE_API_BASE_URL stays empty: the app and the API share one origin.
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.production
          build-contexts: |
            api=docker-image://${{ env.API_IMAGE }}:${{ github.sha }}
          build-args: |
            APP_BUILD=${{ steps.release.outputs.build }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=mombasa-tt-web
          cache-to: type=gha,scope=mombasa-tt-web,mode=max
