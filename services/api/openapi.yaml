components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        match_stake:
          type: boolean
          default: false
    AcceptedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        event: {}
        device_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        received_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - device_time
      - event
      - id
      - received_at
      - sequence
    ActionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        owner_name:
          type: string
          readOnly: true
          nullable: true
        owner_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: For whoever writes the minutes, to change who it is given to;
            null for everyone else.
        mine:
          type: boolean
          readOnly: true
          description: You own it, so you may mark it done.
        due_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ActionItemStatusEnum'
          readOnly: true
        done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - description
      - done_at
      - due_on
      - id
      - item
      - mine
      - owner_id
      - owner_name
      - status
    ActionItemInputRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: An item already recorded; leave out for a new one.
        item:
          oneOf:
          - type: string
            default: ''
            pattern: ^[0-9a-f]{12}$
          - type: string
            maxLength: 0
        description:
          type: string
          minLength: 1
          maxLength: 300
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: The invitee or member of the host who will do it.
        due_on:
          type: string
          format: date
          nullable: true
      required:
      - description
    ActionItemStatusEnum:
      enum:
      - open
      - done
      type: string
      description: |-
        * `open` - Open
        * `done` - Done
    ActionItemStatusRequest:
      type: object
      description: Refuses fields it doesn't know, so a misspelt or smuggled field
        is an error, not silence.
      properties:
        status:
          $ref: '#/components/schemas/ActionItemStatusEnum'
      required:
      - status
    Activity:
      type: object
      description: |-
        One part of a session's running order: a warm-up, a drill on the table, work off it, match play or
        the cool-down. A drill fills in the title when none is given.
      properties:
        phase:
          $ref: '#/components/schemas/PhaseEnum'
        title:
          type: string
          maxLength: 80
        minutes:
          type: integer
          maximum: 240
          minimum: 1
          nullable: true
        drill:
          type: string
          format: uuid
          nullable: true
      required:
      - drill
      - minutes
      - phase
      - title
    ActivityHost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        town:
          type: string
      required:
      - id
      - name
      - town
    ActivityInvitees:
      type: object
      properties:
        invitee_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - invitee_ids
    ActivityRequest:
      type: object
      description: |-
        One part of a session's running order: a warm-up, a drill on the table, work off it, match play or
        the cool-down. A drill fills in the title when none is given.
      properties:
        phase:
          $ref: '#/components/schemas/PhaseEnum'
        title:
          type: string
          maxLength: 80
        minutes:
          type: integer
          maximum: 240
          minimum: 1
          nullable: true
        drill:
          type: string
          format: uuid
          nullable: true
      required:
      - phase
    ActivityStatusEnum:
      enum:
      - draft
      - published
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `cancelled` - Cancelled
    AddUmpireRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
      required:
      - user_id
    AdminHandover:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        kind:
          allOf:
          - $ref: '#/components/schemas/AdminHandoverKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdminHandoverStatusEnum'
          readOnly: true
          default: pending
        from_user:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        to_user:
          $ref: '#/components/schemas/Person'
        created_by:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - decided_at
      - from_user
      - id
      - kind
      - organization
      - reason
      - status
      - to_user
    AdminHandoverKindEnum:
      enum:
      - nomination
      - appointment
      type: string
      description: |-
        * `nomination` - Nomination
        * `appointment` - Appointment
    AdminHandoverStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `declined` - Declined
        * `cancelled` - Cancelled
    AdmissionEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
    AgendaItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/OrgRef'
          readOnly: true
        kind:
          $ref: '#/components/schemas/AgendaItemKindEnum'
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        tournament:
          allOf:
          - $ref: '#/components/schemas/TournamentRef'
          readOnly: true
          nullable: true
      required:
      - description
      - ends_on
      - id
      - kind
      - organization
      - starts_on
      - title
      - tournament
    AgendaItemKindEnum:
      enum:
      - tournament
      - meeting
      - event
      - deadline
      - other
      type: string
      description: |-
        * `tournament` - Tournament
        * `meeting` - Meeting
        * `event` - Event
        * `deadline` - Deadline
        * `other` - Other
    AgendaItemRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AgendaItemKindEnum'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        tournament_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
      required:
      - starts_on
      - title
    AgendaRow:
      type: object
      properties:
        id:
          type: string
          description: Given by the API. Send it back when changing the agenda so
            the item keeps its documents, decisions and action items; leave it out
            for a new item.
          pattern: ^[0-9a-f]{12}$
        title:
          type: string
          maxLength: 200
        presenter:
          type: string
          default: ''
          maxLength: 120
        tournament:
          type: string
          format: uuid
          nullable: true
          description: 'A tournament the item is about: one of the host''s, or any
            published one.'
        tournament_name:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - presenter
      - title
      - tournament
      - tournament_name
    AgendaRowRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: Given by the API. Send it back when changing the agenda so
            the item keeps its documents, decisions and action items; leave it out
            for a new item.
          pattern: ^[0-9a-f]{12}$
        title:
          type: string
          minLength: 1
          maxLength: 200
        presenter:
          type: string
          default: ''
          maxLength: 120
        tournament:
          type: string
          format: uuid
          nullable: true
          description: 'A tournament the item is about: one of the host''s, or any
            published one.'
      required:
      - title
    AllocateRequest:
      type: object
      properties:
        charge_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 1
      required:
      - amount_minor
      - charge_id
    Amendment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        text:
          type: string
          readOnly: true
        by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - by_name
      - created_at
      - id
      - text
    AmendmentInputRequest:
      type: object
      description: Refuses fields it doesn't know, so a misspelt or smuggled field
        is an error, not silence.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - text
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scope:
          allOf:
          - $ref: '#/components/schemas/AnnouncementScopeEnum'
          readOnly: true
        event_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        event_name:
          type: string
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/MatchStageEnum'
          readOnly: true
        round:
          type: integer
          readOnly: true
          nullable: true
        day:
          type: string
          format: date
          readOnly: true
          nullable: true
        session_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AnnouncementStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        outdated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        amends_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        amended_by_id:
          type: string
          nullable: true
          readOnly: true
          description: The published amendment, once there is one.
      required:
      - amended_by_id
      - amends_id
      - body
      - created_at
      - day
      - event_id
      - event_name
      - id
      - outdated_at
      - published_at
      - round
      - scope
      - session_id
      - stage
      - status
      - title
    AnnouncementAudienceEnum:
      enum:
      - members
      - event
      - people
      type: string
      description: |-
        * `members` - members
        * `event` - event
