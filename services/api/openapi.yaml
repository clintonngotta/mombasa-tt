          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/facilities/:
    get:
      operationId: facilities_list
      description: |-
        The facility finder (REQ-044): branches of facility organizations whose profile the caller may
        see, by place and by whether they are open now in the facility's own timezone.
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: City or town, any letter case
      - in: query
        name: country
        schema:
          type: string
        description: Country code, e.g. KE
      - in: query
        name: open_now
        schema:
          type: boolean
        description: Only branches open at this moment
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
        description: Region, any letter case
      - in: query
        name: search
        schema:
          type: string
        description: Branch, facility or town
      tags:
      - facilities
      security:
