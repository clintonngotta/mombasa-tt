          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/tournaments/{tournament_pk}/events/{event_pk}/matches/{id}/lineup/reset/:
    post:
      operationId: tournaments_events_matches_lineup_reset_create
      description: Competition staff send both teams back to choose again, while no
