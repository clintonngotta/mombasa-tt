      - since
      - table
      - table_id
    Resolution:
      type: object
      description: A later match that had started with an entry a corrected result
        says should not be there.
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_name:
          type: string
        match_id:
          type: string
          format: uuid
        label:
          type: string
        a:
          type: string
        b:
          type: string
        side:
          $ref: '#/components/schemas/SideEnum'
        old_entry:
          type: string
          description: Who is in the match now.
        new_entry:
          type: string
          description: Who should be; empty when an earlier match is played again
            first.
        progress:
          $ref: '#/components/schemas/ProgressEnum'
        reason:
          type: string
          description: The reason given for the correction.
        corrected_by:
          type: string
        created_at:
          type: string
          format: date-time
