                $ref: '#/components/schemas/ApiError'
  /api/v1/tournaments/{tournament_pk}/events/{id}/:
    patch:
      operationId: tournaments_events_partial_update
      description: |-
        Change an event's set-up. Once it has started its structure (type, format, best of, seeding,
        groups and qualifiers) is frozen: asking to change it is a 409, never a silent no-op.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: tournament_pk
