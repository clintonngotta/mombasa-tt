openapi: 3.0.3
info:
  title: Coast TT API
  version: 1.0.0
paths:
  /api/v1/attachments/{id}/content/:
    get:
      operationId: attachments_content_retrieve
      description: |-
        The file itself. The signed token is the authorization (it was checked when the link was issued),
        so no session is needed and an image tag can load it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: From a signed link
        required: true
      tags:
      - attachments
      security:
      - {}
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/attachments/{id}/url/:
    get:
      operationId: attachments_url_retrieve
      description: |-
        Issue a fresh signed link. An attachment the caller may not read answers 404, exactly like one
        that doesn't exist.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentLink'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/invitations/{token}/:
    get:
      operationId: auth_invitations_retrieve
      description: 'An invitation link (`/join/<token>`), open to whoever holds it:
        the link is the proof.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDetail'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: auth_invitations_create
      description: |-
        Create the invitee's account from the guest. Signed in at once when the email or phone they
        chose is the one the invitation went to; otherwise their email needs verifying first.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationJoinRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationJoined'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/invitations/{token}/claim/:
    post:
      operationId: auth_invitations_claim_create
      description: A signed-in player with an invitation link claims the guest for
        their own account.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyClaim'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/verification/confirm/:
    post:
      operationId: auth_verification_confirm_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/verification/resend/:
    post:
      operationId: auth_verification_resend_create
      description: |-
        Anonymous endpoints. DRF skips CSRF for anonymous users, so enforce it explicitly
        (prevents login CSRF).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/coaches/:
    get:
      operationId: coaches_list
      description: 'GET /coaches/: coaches taking players, filtered by name, town,
        region or a skill they teach.'
      parameters:
      - in: query
        name: level
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Name, headline or town
      - in: query
        name: skill
        schema:
          type: string
      tags:
      - coaches
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoachProfileList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/coaches/{id}/:
    get:
      operationId: coaches_retrieve
      description: |-
        GET /coaches/{user id}/: a coach's profile. Their trainees still see it after they stop taking
        new players.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - coaches
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachProfile'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/coaches/{id}/slots/:
    get:
      operationId: coaches_slots_list
      description: 'GET /coaches/{user id}/slots/: free start times for a session
        in the next days.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1 to 28, default 14
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day, in the coach's timezone; today by default
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: minutes
        schema:
          type: integer
        description: Session length, 30 to 180, default 60
      tags:
      - coaches
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/drills/:
    get:
      operationId: drills_list
      description: 'GET /drills/: every drill the player may use, standard ones first;
        GET /drills/{id}/ one of them.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: level
        schema:
          type: string
      - in: query
        name: library
        schema:
          type: string
          enum:
          - club
          - personal
          - standard
      - in: query
        name: search
        schema:
          type: string
        description: Title or focus
      tags:
      - drills
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drill'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/drills/{id}/:
    get:
      operationId: drills_retrieve
      description: 'GET /drills/: every drill the player may use, standard ones first;
        GET /drills/{id}/ one of them.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this drill.
        required: true
      tags:
      - drills
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drill'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/events/:
    get:
      operationId: events_list
      description: 'GET /events/: the public listing of table tennis events, on Coast
        TT and elsewhere.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Events still on from this day (calendar view)
      - in: query
        name: host
        schema:
          type: string
        description: The host or submitting club's id
      - in: query
        name: ours
        schema:
          type: boolean
        description: Only the caller's clubs
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Events starting by this day
      - in: query
        name: town
        schema:
          type: string
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
      tags:
      - events
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListedEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/external-events/{id}/approve/:
    post:
      operationId: external_events_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - external-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/external-events/{id}/reject/:
    post:
      operationId: external_events_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - external-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/external-events/{id}/remove-link/:
    post:
      operationId: external_events_remove_link_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - external-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/external-events/{id}/report/:
    post:
      operationId: external_events_report_create
      description: Report an external event's live link. Once per person.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - external-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkReportRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/external-events/review/:
    get:
      operationId: external_events_review_list
      description: External events waiting for review, and reported links, for the
        platform's curators.
      tags:
      - external-events
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/facilities/:
    get:
      operationId: facilities_list
      description: |-
        The facility finder (REQ-044): branches of facility organizations whose profile the caller may
        see, by place and by whether they are open now in the facility's own timezone.
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: City or town, any letter case
      - in: query
        name: country
        schema:
          type: string
        description: Country code, e.g. KE
      - in: query
        name: open_now
        schema:
          type: boolean
        description: Only branches open at this moment
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
        description: Region, any letter case
      - in: query
        name: search
        schema:
          type: string
        description: Branch, facility or town
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacilityList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/facilities/{id}/:
    get:
      operationId: facilities_retrieve
      description: |-
        The facility finder (REQ-044): branches of facility organizations whose profile the caller may
        see, by place and by whether they are open now in the facility's own timezone.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this venue.
        required: true
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityProfile'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/facilities/{id}/schedule/:
    get:
      operationId: facilities_schedule_list
      description: |-
        What the branch has coming up, in date order: training slots any player may join, the
        facility's public activities, and tournaments held here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this venue.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - facilities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchScheduleItemList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/facilities/nearby/:
    post:
      operationId: facilities_nearby_create
      description: |-
        Branches the caller may find with a map position inside `radius_m` of the given point,
        nearest first, at most 50. The point is sent in the body so the player's position stays out
        of URLs and logs.
      tags:
      - facilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearbyFacilitySearchRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyFacilities'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/feedback-forms/{id}/:
    get:
      operationId: feedback_forms_retrieve
      description: |-
        GET /feedback-forms/{id}/: a form you were asked to answer, with your answers. PUT
        /feedback-forms/{id}/ saves them: once each, changed as often as you like until it closes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - feedback-forms
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFeedbackForm'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: feedback_forms_update
      description: |-
        GET /feedback-forms/{id}/: a form you were asked to answer, with your answers. PUT
        /feedback-forms/{id}/ saves them: once each, changed as often as you like until it closes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - feedback-forms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackAnswersRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFeedbackForm'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/geography/countries/:
    get:
      operationId: geography_countries_list
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
