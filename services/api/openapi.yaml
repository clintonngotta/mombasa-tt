      - note
    ResultCorrectionRequest:
      type: object
      description: |-
        A result recorded by the organizers. `games` are [a, b] points in playing order: none for a
        walkover, the games played so far for a retirement. For a tie, name the rubber.
      properties:
        winner_entry_id:
          type: string
          format: uuid
        outcome:
          allOf:
          - $ref: '#/components/schemas/MatchOutcomeEnum'
          default: played
        games:
          type: array
          items:
            type: array
            items:
              type: integer
              maximum: 99
              minimum: 0
            maxItems: 2
            minItems: 2
          maxItems: 9
        rubber_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - reason
      - winner_entry_id
    ResultEntryRequest:
      type: object
      description: |-
        A result recorded by the organizers. `games` are [a, b] points in playing order: none for a
        walkover, the games played so far for a retirement. For a tie, name the rubber.
      properties:
        winner_entry_id:
          type: string
          format: uuid
        outcome:
          allOf:
          - $ref: '#/components/schemas/MatchOutcomeEnum'
          default: played
        games:
          type: array
          items:
            type: array
            items:
              type: integer
              maximum: 99
              minimum: 0
            maxItems: 2
            minItems: 2
          maxItems: 9
        rubber_id:
          type: string
          format: uuid
          nullable: true
