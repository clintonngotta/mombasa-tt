components:
  schemas:
    ActionEnum:
      enum:
      - published
      - updated
      - started
      - completed
      - cancelled
      - event_started
      - event_completed
      - event_cancelled
      - event_removed
      type: string
      description: |-
        * `published` - Published
        * `updated` - Updated
        * `started` - Started
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `event_started` - Event Started
        * `event_completed` - Event Completed
        * `event_cancelled` - Event Cancelled
        * `event_removed` - Event Removed
    AttachmentLink:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AttachmentLinkRequest:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AvatarUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, up to 5 MB
      required:
      - file
    BestOfEnum:
      enum:
      - 3
      - 5
      - 7
      type: integer
      description: |-
        * `3` - 3
        * `5` - 5
        * `7` - 7
    BlankEnum:
      enum:
      - ''
    DirectoryPlayer:
      type: object
      description: |-
        Directory card of a listed player: name, picture and organizations only. No email, bio, location
        or other details.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        nickname:
          type: string
        avatar:
          allOf:
          - $ref: '#/components/schemas/AttachmentLink'
          readOnly: true
          nullable: true
        clubs:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - avatar
      - clubs
      - display_name
      - id
      - nickname
    Draw:
      type: object
      description: 'One version of an event''s draw: who sits where, and every match
        with its sides.'
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: '#/components/schemas/DrawStatusEnum'
        rules_version:
          type: string
        rng_seed:
          type: integer
        stale:
          type: boolean
          description: The accepted entries or the event's format changed since this
            draw was made.
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DrawGroup'
        places:
          type: array
          items:
            $ref: '#/components/schemas/DrawPlace'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
      required:
      - created_at
      - groups
      - id
      - matches
      - places
      - published_at
      - rng_seed
      - rules_version
      - stale
      - status
      - version
    DrawEntry:
      type: object
      description: 'An accepted entry as a draw shows it: its name and players.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/EntryPlayer'
          readOnly: true
        mine:
          type: boolean
          description: Whether the caller plays in it, so screens can point out their
            own matches.
          readOnly: true
      required:
      - id
      - mine
      - players
      - title
    DrawGroup:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
      required:
      - name
      - number
    DrawPlace:
      type: object
      properties:
        entry:
          $ref: '#/components/schemas/DrawEntry'
        seed:
          type: integer
          nullable: true
        group:
          type: integer
          nullable: true
        group_position:
          type: integer
          nullable: true
        bracket_position:
          type: integer
          nullable: true
      required:
      - bracket_position
      - entry
      - group
      - group_position
      - seed
    DrawRequestRequest:
      type: object
      description: Seeds in order, best first (accepted entries of the event). `rng_seed`
        repeats an earlier draw.
      properties:
        seeded_entry_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 32
        rng_seed:
          type: integer
          maximum: 2147483647
          minimum: 0
    DrawStatusEnum:
      enum:
      - preview
      - published
      - superseded
      type: string
      description: |-
        * `preview` - Preview
        * `published` - Published
        * `superseded` - Superseded
    EmailOnlyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Entry:
      type: object
      description: |-
        An entry as its players, staff and (once accepted) everybody else see it. Deliberately nothing
        about payment: accepted means a place in the event, not a paid fee (REQ-008).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EntryStatusEnum'
          readOnly: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/EntryPlayer'
          readOnly: true
        team_name:
          type: string
          readOnly: true
        captain_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        checked_in_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        mine:
          type: boolean
          description: Whether the caller plays in it, so may withdraw it.
          readOnly: true
      required:
      - captain_id
      - checked_in_at
      - created_at
      - decided_at
      - id
      - mine
      - players
      - reason
      - status
      - team_name
      - withdrawn_at
    EntryEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/EventKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
      required:
      - id
      - kind
      - name
      - status
    EntryPlayer:
      type: object
      description: 'A player in an entry: the name they play under, nothing else (REQ-020).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    EntryRequestRequest:
      type: object
      description: Who is entering. Left out, `player_ids` is the caller alone and
        `captain_id` the caller.
      properties:
        player_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
        team_name:
          type: string
          maxLength: 80
        captain_id:
          type: string
          format: uuid
          nullable: true
    EntryStatusEnum:
      enum:
      - pending
      - accepted
      - waitlisted
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `waitlisted` - Waitlisted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    EntryTournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        starts_on:
          type: string
          format: date
          readOnly: true
        ends_on:
          type: string
          format: date
          readOnly: true
        timezone:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TournamentStatusEnum'
          readOnly: true
      required:
      - ends_on
      - id
      - name
      - starts_on
      - status
      - timezone
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        format:
          $ref: '#/components/schemas/EventFormatEnum'
        capacity:
          type: integer
          maximum: 512
          minimum: 2
          nullable: true
        best_of:
          $ref: '#/components/schemas/BestOfEnum'
        rest_minutes:
          type: integer
          maximum: 240
          minimum: 0
        registration_opens_at:
          type: string
          format: date-time
          nullable: true
        registration_closes_at:
          type: string
          format: date-time
          nullable: true
        entry_fee:
          $ref: '#/components/schemas/Money'
        seeding:
          $ref: '#/components/schemas/SeedingEnum'
        group_count:
          type: integer
          maximum: 64
          minimum: 2
          nullable: true
        qualifiers_per_group:
          type: integer
          maximum: 8
          minimum: 1
          nullable: true
        tie_rubbers:
          type: array
          items:
            $ref: '#/components/schemas/SinglesOrDoublesEnum'
          description: 'Team events: the individual matches of a tie in playing order.
            Empty otherwise.'
          maxItems: 9
        tie_wins_needed:
          type: integer
          maximum: 9
          minimum: 1
          nullable: true
          description: 'Team events: rubbers a team must win to take the tie; at most
            half of them, rounded up, so a tie always has a winner. Null otherwise.'
        accepted_count:
          type: integer
          description: Entries holding a place. Counted here when the caller didn't
            annotate it.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
      required:
      - accepted_count
      - best_of
      - cancel_reason
      - cancelled_at
      - capacity
      - completed_at
      - entry_fee
      - format
      - group_count
      - id
      - kind
      - name
      - qualifiers_per_group
      - registration_closes_at
      - registration_opens_at
      - rest_minutes
      - revision
      - seeding
      - started_at
      - status
      - tie_rubbers
      - tie_wins_needed
    EventDraw:
      type: object
      description: The event's published draw and, for competition staff only, the
        preview being worked on.
      properties:
        published:
          allOf:
          - $ref: '#/components/schemas/Draw'
          nullable: true
        preview:
          allOf:
          - $ref: '#/components/schemas/Draw'
          nullable: true
      required:
      - preview
      - published
    EventFormatEnum:
      enum:
      - round_robin
      - knockout
      - groups_knockout
      type: string
      description: |-
        * `round_robin` - Round Robin
        * `knockout` - Knockout
        * `groups_knockout` - Groups Knockout
    EventKindEnum:
      enum:
      - singles
      - doubles
      - team
      type: string
      description: |-
        * `singles` - Singles
        * `doubles` - Doubles
        * `team` - Team
    EventRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        format:
          $ref: '#/components/schemas/EventFormatEnum'
        capacity:
          type: integer
          maximum: 512
          minimum: 2
          nullable: true
        best_of:
          $ref: '#/components/schemas/BestOfEnum'
        rest_minutes:
          type: integer
          maximum: 240
          minimum: 0
        registration_opens_at:
          type: string
          format: date-time
          nullable: true
        registration_closes_at:
          type: string
          format: date-time
          nullable: true
        entry_fee:
          $ref: '#/components/schemas/MoneyRequest'
        seeding:
          $ref: '#/components/schemas/SeedingEnum'
        group_count:
          type: integer
          maximum: 64
          minimum: 2
          nullable: true
        qualifiers_per_group:
          type: integer
          maximum: 8
          minimum: 1
          nullable: true
        tie_rubbers:
          type: array
          items:
            $ref: '#/components/schemas/SinglesOrDoublesEnum'
          description: 'Team events: the individual matches of a tie in playing order.
            Empty otherwise.'
          maxItems: 9
        tie_wins_needed:
          type: integer
          maximum: 9
          minimum: 1
          nullable: true
          description: 'Team events: rubbers a team must win to take the tie; at most
            half of them, rounded up, so a tie always has a winner. Null otherwise.'
      required:
      - format
      - kind
      - name
    EventStatusEnum:
      enum:
      - scheduled
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    ExperienceEnum:
      enum:
      - new
      - casual
      - club
      - competitive
      type: string
      description: |-
        * `new` - New
        * `casual` - Casual
        * `club` - Club
        * `competitive` - Competitive
    Game:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    GameRequest:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    Goals:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalsEnum'
          maxItems: 6
