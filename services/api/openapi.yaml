components:
  schemas:
    ActionEnum:
      enum:
      - published
      - started
      - completed
      - cancelled
      - event_started
      - event_completed
      - event_cancelled
      - event_removed
      type: string
      description: |-
        * `published` - Published
        * `started` - Started
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `event_started` - Event Started
        * `event_completed` - Event Completed
        * `event_cancelled` - Event Cancelled
        * `event_removed` - Event Removed
    AttachmentLink:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AttachmentLinkRequest:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AvatarUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, up to 5 MB
      required:
      - file
    BestOfEnum:
      enum:
      - 3
      - 5
      - 7
      type: integer
      description: |-
        * `3` - 3
        * `5` - 5
        * `7` - 7
    BlankEnum:
      enum:
      - ''
    DirectoryPlayer:
      type: object
      description: |-
        Directory card of a listed player: name, picture and organizations only. No email, bio, location
        or other details.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        nickname:
          type: string
        avatar:
          allOf:
          - $ref: '#/components/schemas/AttachmentLink'
          readOnly: true
          nullable: true
        clubs:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - avatar
      - clubs
      - display_name
      - id
      - nickname
    EmailOnlyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        format:
          $ref: '#/components/schemas/EventFormatEnum'
        capacity:
          type: integer
          maximum: 512
          minimum: 2
          nullable: true
        best_of:
          $ref: '#/components/schemas/BestOfEnum'
        rest_minutes:
          type: integer
          maximum: 240
          minimum: 0
        registration_opens_at:
          type: string
          format: date-time
          nullable: true
        registration_closes_at:
          type: string
          format: date-time
          nullable: true
        entry_fee:
          $ref: '#/components/schemas/Money'
        seeding:
          $ref: '#/components/schemas/SeedingEnum'
        group_count:
          type: integer
          maximum: 64
          minimum: 2
          nullable: true
        qualifiers_per_group:
          type: integer
          maximum: 8
          minimum: 1
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
        revision:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
      required:
      - best_of
      - cancel_reason
      - cancelled_at
      - capacity
      - completed_at
      - entry_fee
      - format
      - group_count
      - id
      - kind
      - name
      - qualifiers_per_group
      - registration_closes_at
      - registration_opens_at
      - rest_minutes
      - revision
      - seeding
      - started_at
      - status
    EventFormatEnum:
      enum:
      - round_robin
      - knockout
      - groups_knockout
      type: string
      description: |-
        * `round_robin` - Round Robin
        * `knockout` - Knockout
        * `groups_knockout` - Groups Knockout
    EventKindEnum:
      enum:
      - singles
      - doubles
      - team
      type: string
      description: |-
        * `singles` - Singles
        * `doubles` - Doubles
        * `team` - Team
    EventRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        format:
          $ref: '#/components/schemas/EventFormatEnum'
        capacity:
          type: integer
          maximum: 512
          minimum: 2
          nullable: true
        best_of:
          $ref: '#/components/schemas/BestOfEnum'
        rest_minutes:
          type: integer
          maximum: 240
          minimum: 0
        registration_opens_at:
          type: string
          format: date-time
          nullable: true
        registration_closes_at:
          type: string
          format: date-time
          nullable: true
        entry_fee:
          $ref: '#/components/schemas/MoneyRequest'
        seeding:
          $ref: '#/components/schemas/SeedingEnum'
        group_count:
          type: integer
          maximum: 64
          minimum: 2
          nullable: true
        qualifiers_per_group:
          type: integer
          maximum: 8
          minimum: 1
          nullable: true
      required:
      - format
      - kind
      - name
    EventStatusEnum:
      enum:
      - scheduled
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    ExperienceEnum:
      enum:
      - new
      - casual
      - club
      - competitive
      type: string
      description: |-
        * `new` - New
        * `casual` - Casual
        * `club` - Club
        * `competitive` - Competitive
    Game:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    GameRequest:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    Goals:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalsEnum'
          maxItems: 6
      required:
      - goals
    GoalsEnum:
      enum:
      - compete
      - rating
      - train
      - find_club
      - umpire
      - organize
      type: string
      description: |-
        * `compete` - Compete
        * `rating` - Rating
        * `train` - Train
        * `find_club` - Find Club
        * `umpire` - Umpire
        * `organize` - Organize
    GoalsRequest:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalsEnum'
          maxItems: 6
      required:
      - goals
    GripEnum:
      enum:
      - shakehand
      - penhold
      - other
      type: string
      description: |-
        * `shakehand` - Shakehand
        * `penhold` - Penhold
        * `other` - Other
    HandEnum:
      enum:
