          type: string
          readOnly: true
        player_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        player_name:
          type: string
          readOnly: true
        walk_in_name:
          type: string
          readOnly: true
        amount_minor:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        method:
