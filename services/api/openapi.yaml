components:
  schemas:
    AcceptedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        event: {}
        device_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        received_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - device_time
      - event
      - id
      - received_at
      - sequence
    ActionEnum:
      enum:
      - published
      - approval_requested
      - approval_rejected
      - updated
      - started
      - completed
      - cancelled
      - event_started
      - event_completed
      - event_cancelled
      - event_removed
      type: string
      description: |-
        * `published` - Published
        * `approval_requested` - Approval Requested
        * `approval_rejected` - Approval Rejected
        * `updated` - Updated
        * `started` - Started
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `event_started` - Event Started
        * `event_completed` - Event Completed
        * `event_cancelled` - Event Cancelled
        * `event_removed` - Event Removed
    AdmissionEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
    ApprovalStatusEnum:
      enum:
      - not_requested
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `not_requested` - Not requested
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    AssignUmpireRequest:
      type: object
      description: '`user_id` null takes the match back from its umpire. `rubber_id`
        names the rubber of a tie.'
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        rubber_id:
          type: string
          format: uuid
          nullable: true
      required:
      - user_id
    AssignmentStep:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AssignmentStepKindEnum'
        umpire:
          type: string
        actor:
          type: string
        device_label:
          type: string
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - actor
      - created_at
      - device_label
      - kind
      - revision
      - umpire
    AssignmentStepKindEnum:
      enum:
      - assigned
      - unassigned
      - device
      - take_over
      - reset
      type: string
      description: |-
        * `assigned` - Assigned
        * `unassigned` - Unassigned
        * `device` - Device
        * `take_over` - Take Over
        * `reset` - Reset
    AttachmentLink:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AttachmentLinkRequest:
      type: object
      description: |-
        A short-lived link to an attachment's content. `url` is a path on the API origin.

        Serializing one issues the link, so only use it where the viewer has already been allowed to read
        the attachment. Give it the attachment id.
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - url
    AuthorityEnum:
      enum:
      - platform
      - country
      - regional
      type: string
      description: |-
        * `platform` - platform
        * `country` - country
        * `regional` - regional
    AutoDispatchRequest:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    AvatarUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, up to 5 MB
      required:
      - file
    BestOfEnum:
      enum:
      - 3
      - 5
      - 7
      type: integer
      description: |-
        * `3` - 3
        * `5` - 5
        * `7` - 7
    BlankEnum:
      enum:
      - ''
    Board:
      type: object
      description: |-
        The dispatch board: the tables, the queue in its fixed order and what is suggested. A suggestion
        is only that: sending it checks everything again.
      properties:
        auto_dispatch:
          type: boolean
        in_play:
          type: boolean
        tables:
          type: array
          items:
            $ref: '#/components/schemas/BoardTable'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueuedMatch'
        to_come:
          type: integer
          description: Matches still waiting for an earlier result.
      required:
      - auto_dispatch
      - in_play
      - queue
      - tables
      - to_come
    BoardTable:
      type: object
      description: One of the tournament's tables and whether a match holds it right
        now.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        free:
          type: boolean
        held_by:
          type: string
          description: Tournament and event of the match on it.
        since:
          type: string
          format: date-time
          nullable: true
        playing:
          allOf:
          - $ref: '#/components/schemas/Reservation'
          nullable: true
          description: This tournament's match on the table.
        suggested_match_id:
          type: string
          format: uuid
          nullable: true
        idle_reason:
          type: string
          description: Why a free table has no match.
      required:
      - free
      - held_by
      - id
      - idle_reason
      - label
      - playing
      - since
      - suggested_match_id
    ClubRanking:
      type: object
      properties:
        discipline:
          $ref: '#/components/schemas/SinglesOrDoublesEnum'
        processing:
          type: boolean
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ClubRankingRow'
      required:
      - discipline
      - processing
      - rows
    ClubRankingRow:
      type: object
      properties:
        rank:
          type: integer
          description: Clubs with the same total share a rank.
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        town:
          type: string
        total_points:
          type: number
          format: double
          description: Sum of current ratings of active rated members.
        rated_members:
          type: integer
      required:
      - name
      - organization_id
      - rank
      - rated_members
      - total_points
      - town
    ConfirmRequest:
      type: object
      description: |-
        The assignment the deck holds (a device cut off by a reassignment can't confirm) and the
        revision it shows (a result is never confirmed over points still on their way).
      properties:
        assignment_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
      required:
      - assignment_id
      - revision
    ConflictEventRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          maximum: 100000
          minimum: 1
          description: Its place in the stream on the device.
        event: {}
        device_time:
          type: string
          format: date-time
          nullable: true
      required:
      - event
      - id
      - sequence
    ConflictReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
    ConflictReportRequest:
      type: object
      description: |-
        What a device wrote and the server didn't take, sent for the organizers to see. The id is the
        device's own, so sending it twice keeps one report.
      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          format: uuid
          nullable: true
        device_label:
          type: string
          default: ''
          maxLength: 80
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConflictEventRequest'
          maxItems: 500
          minItems: 1
      required:
      - events
      - id
    CountryCatalogue:
      type: object
      properties:
        catalogue_only:
          type: boolean
          description: Use this catalogue as the source of location choices for this
            country.
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          readOnly: true
      required:
      - catalogue_only
      - regions
    CountryOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    DeckPlayer:
      type: object
      properties:
        slot:
          $ref: '#/components/schemas/SlotEnum'
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - id
      - slot
    DeckSide:
      type: object
      properties:
        title:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/DeckPlayer'
      required:
      - players
      - title
    Device:
      type: object
      description: Which device is scoring the sheet. `here` compares with the caller's
        X-Device-Id header.
      properties:
        held:
          type: boolean
          description: A device has taken the sheet.
        here:
          type: boolean
          description: It is the caller's device.
        label:
          type: string
        since:
          type: string
          format: date-time
          nullable: true
      required:
      - held
      - here
      - label
      - since
    DirectoryPlayer:
      type: object
      description: |-
        Directory card of a listed player: name, picture and organizations only. No email, bio, location
        or other details.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        nickname:
          type: string
        avatar:
          allOf:
          - $ref: '#/components/schemas/AttachmentLink'
          readOnly: true
          nullable: true
        clubs:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - avatar
      - clubs
      - display_name
      - id
      - nickname
    DispatchRequest:
      type: object
      description: |-
        Send the match to a table. `overrides` sets aside the check-in or rest check, with a reason;
        nothing sets aside that a table and a player are in one place at a time.
      properties:
        table_id:
          type: string
          format: uuid
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverridesEnum'
        reason:
          type: string
          maxLength: 300
      required:
