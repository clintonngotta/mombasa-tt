          format: uuid
          readOnly: true
        key:
          allOf:
          - $ref: '#/components/schemas/RoleKeyEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - key
      - name
    Rubber:
      type: object
