      - games_won
      - points
      - receiver
      - server
      - status
      - timeouts
      - winner
    ScoringStatusEnum:
      enum:
      - unassigned
      - assigned
      - in_progress
      - finished
      - confirmed
      type: string
      description: |-
        * `unassigned` - Unassigned
        * `assigned` - Assigned
        * `in_progress` - In Progress
        * `finished` - Finished
        * `confirmed` - Confirmed
    ScoringSummary:
      type: object
      description: |-
        Where the scoring of a match or rubber stands. `can_score` is true only for the umpire assigned
        to it, so nobody else is ever offered a way into the scoring deck (REQ-010).
      properties:
        scorecard_id:
          type: string
          format: uuid
          nullable: true
          description: Given to the assigned umpire only.
        status:
          $ref: '#/components/schemas/ScoringStatusEnum'
        umpire_name:
          type: string
        can_score:
          type: boolean
        can_assign:
          type: boolean
          description: The caller may assign or change the umpire now.
      required:
      - can_assign
      - can_score
      - scorecard_id
      - status
      - umpire_name
    SeedingEnum:
      enum:
      - rating
      - manual
      - none
      type: string
      description: |-
        * `rating` - Rating
        * `manual` - Manual
        * `none` - None
    SentEventRequest:
      type: object
      description: |-
        One score event from the deck: its own id (so a retry is recognised), its place in the stream,
        the engine event itself, and the device's clock, which is kept but decides nothing.
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        event: {}
        device_time:
          type: string
          format: date-time
          nullable: true
        expected_revision:
          type: integer
          minimum: 0
          description: The server revision the device had seen when it sent this.
            If the server holds less than that, its stream is not the one the device
            built on, and the event is refused.
      required:
      - event
      - id
      - sequence
    SheetContext:
      type: object
      description: Which match a sheet is for, as the organizers' scoring page shows
