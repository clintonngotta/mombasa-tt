      - committee
      - member
      type: string
      description: |-
        * `admin` - Admin
        * `captain` - Captain
        * `assistant_captain` - Assistant Captain
        * `committee` - Committee
        * `member` - Member
    RoleRequest:
      type: object
      description: A role and its permissions (REQ-005). Admin always reports every
        permission.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        permissions:
          type: array
          items:
