    Pass:
      type: object
      description: 'A price at a branch (REQ-044): amounts are integer minor units
        with their currency.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/PassKindEnum'
        amount_minor:
          type: integer
          maximum: 10000000
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        sessions:
          type: integer
          maximum: 100
          minimum: 2
          nullable: true
        valid_days:
          type: integer
          maximum: 366
          minimum: 1
          nullable: true
        benefits:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 12
        active:
          type: boolean
      required:
      - active
      - amount_minor
      - benefits
      - currency
      - id
      - kind
      - name
      - sessions
      - valid_days
    PassKindEnum:
      enum:
      - day
      - week
      - month
      - sessions
      type: string
      description: |-
        * `day` - Day pass
        * `week` - Week pass
        * `month` - Month pass
        * `sessions` - Sessions bundle
    PassRequest:
      type: object
      description: 'A price at a branch (REQ-044): amounts are integer minor units
        with their currency.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/PassKindEnum'
        amount_minor:
          type: integer
          maximum: 10000000
          minimum: 0
        currency:
          type: string
          minLength: 1
          pattern: ^[A-Z]{3}$
        sessions:
          type: integer
          maximum: 100
          minimum: 2
          nullable: true
        valid_days:
          type: integer
          maximum: 366
          minimum: 1
          nullable: true
        benefits:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          maxItems: 12
        active:
          type: boolean
      required:
      - amount_minor
      - kind
      - name
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - token
      - uid
    PastHolder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: string
        display_name:
          type: string
        started_on:
          type: string
          format: date
        ended_on:
          type: string
          format: date
        end_reason:
          $ref: '#/components/schemas/PastHolderEndReasonEnum'
      required:
      - display_name
      - end_reason
      - ended_on
      - id
      - position
      - started_on
    PastHolderEndReasonEnum:
      enum:
      - replaced
      - stepped_down
      - left
      - position_retired
      type: string
      description: |-
        * `replaced` - Replaced
        * `stepped_down` - Stepped Down
        * `left` - Left
        * `position_retired` - Position Retired
    PatchedAccountUpdateRequest:
      type: object
      description: What players change about their own account. A new phone number
        starts unconfirmed.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          nullable: true
          maxLength: 32
    PatchedAgendaItemRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AgendaItemKindEnum'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        tournament_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
    PatchedArticleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        summary:
          type: string
          maxLength: 280
        body:
          type: string
          minLength: 1
          maxLength: 10000
