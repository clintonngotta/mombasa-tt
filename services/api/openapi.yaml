          description: Points of each game as [a, b], in playing order.
        tie_score:
          type: array
          items:
            type: integer
          nullable: true
          description: 'Team ties that have begun: rubbers won as [a, b]. Null otherwise.'
          maxItems: 2
          minItems: 2
        table:
          type: string
          description: The table's label; empty until one is given.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: 'When it is expected to start: an estimate. Null until it is
            scheduled.'
        dispatched_at:
          type: string
          format: date-time
          nullable: true
          description: When it was sent to its table. Null while it isn't on one.
        group_name:
          type: string
          description: Empty for a knockout match.
        winner_plays_in:
          type: string
          description: The round its winner goes on to; empty when nothing follows.
        draw_version:
          type: integer
        tie:
          allOf:
          - $ref: '#/components/schemas/Tie'
          nullable: true
          description: Team events only.
        scoring:
          allOf:
          - $ref: '#/components/schemas/ScoringSummary'
          nullable: true
          description: 'Null for a tie: its rubbers are scored.'
        on_table:
          allOf:
          - $ref: '#/components/schemas/OnTable'
          nullable: true
        can_dispatch:
          type: boolean
          description: The caller may send it to a table or call it back.
        result:
          allOf:
          - $ref: '#/components/schemas/OfficialResult'
          nullable: true
          description: The official result that stands.
        result_history:
          type: array
          items:
            $ref: '#/components/schemas/OfficialResult'
          description: Every version, of the match and of its rubbers. Competition
            staff only.
        can_record_result:
          type: boolean
          description: The caller may enter or correct its result.
        held_for_correction:
          type: boolean
          description: A corrected earlier result put its opponent in question; nothing
            is played until settled.
