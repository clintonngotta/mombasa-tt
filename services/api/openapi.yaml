  /api/v1/coaches/{id}/slots/:
    get:
      operationId: coaches_slots_list
      description: 'GET /coaches/{user id}/slots/: free start times for a session
        in the next days.'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1 to 28, default 14
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day, in the coach's timezone; today by default
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: minutes
        schema:
          type: integer
        description: Session length, 30 to 180, default 60
      tags:
      - coaches
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/drills/:
    get:
      operationId: drills_list
      description: 'GET /drills/: every drill the player may use, standard ones first;
