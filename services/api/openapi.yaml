        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
          nullable: true
      required:
      - a
      - b
      - choice
      - corrected_by
      - created_at
      - event_id
      - event_name
      - id
      - label
      - match_id
      - new_entry
      - note
      - old_entry
      - progress
      - reason
      - resolved_at
      - resolved_by
      - side
    ResolutionChoiceEnum:
      enum:
      - keep
      - replace
      - withdrawn
      type: string
      description: |-
        * `keep` - Keep
        * `replace` - Replace
        * `withdrawn` - Withdrawn
    ResolveChoiceEnum:
      enum:
      - keep
      - replace
      type: string
      description: |-
        * `keep` - keep
        * `replace` - replace
    ResolveConflictRequest:
      type: object
