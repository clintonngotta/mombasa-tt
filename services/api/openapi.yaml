openapi: 3.0.3
info:
  title: mombasa-tt API
  version: 1.0.0
paths:
  /api/v1/attachments/{id}/content/:
    get:
      operationId: attachments_content_retrieve
      description: |-
        The file itself. The signed token is the authorization (it was checked when the link was issued),
        so no session is needed and an image tag can load it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: From a signed link
        required: true
      tags:
      - attachments
      security:
      - {}
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/attachments/{id}/url/:
    get:
      operationId: attachments_url_retrieve
      description: |-
        Issue a fresh signed link. An attachment the caller may not read answers 404, exactly like one
        that doesn't exist.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentLink'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
