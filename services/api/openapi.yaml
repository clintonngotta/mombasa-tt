      required:
      - conflicts
      - reservations
      - sheets
    ScoringState:
      type: object
      description: The canonical state of the scoring engine (packages/scoring).
      properties:
        status:
          $ref: '#/components/schemas/EnginePhaseEnum'
        game_number:
          type: integer
        games:
          type: array
          items:
            type: array
            items:
              type: integer
            maxItems: 2
            minItems: 2
        games_won:
          type: array
          items:
            type: integer
          maxItems: 2
          minItems: 2
        points:
          type: array
          items:
            type: integer
          maxItems: 2
          minItems: 2
        server:
