        scorecard_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_name:
          type: string
        match_id:
          type: string
          format: uuid
        label:
          type: string
        a:
          type: string
        b:
          type: string
      required:
      - a
      - b
      - event_id
      - event_name
      - label
      - match_id
      - scorecard_id
    SideEnum:
      enum:
      - a
      - b
      type: string
      description: |-
        * `a` - a
        * `b` - b
