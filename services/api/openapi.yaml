          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
      required:
      - approval_status
      - cancel_reason
      - cancelled_at
      - completed_at
      - description
      - ends_on
      - events
      - id
      - name
      - organization
      - published_at
      - registration_fee
      - scope
      - started_at
      - starts_on
      - status
      - timezone
      - venue
    TournamentRequest:
      type: object
      description: |-
        A tournament with its events. The same fields serve staff and the public (REQ-020): nothing here
        is private once the tournament is published, and drafts are served to the host's staff only.
      properties:
        venue_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        scope:
          $ref: '#/components/schemas/TournamentScopeEnum'
        registration_fee:
          $ref: '#/components/schemas/RegistrationFeeRequest'
      required:
      - ends_on
      - name
      - starts_on
    TournamentScopeEnum:
      enum:
      - local
      - regional
      - national
      - international
      type: string
      description: |-
        * `local` - Local
        * `regional` - Regional
        * `national` - National
        * `international` - International
    TournamentStatusEnum:
      enum:
      - draft
      - published
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    Umpire:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - display_name
      - email
      - email_verified_at
      - id
    Venue:
      type: object
      description: A venue with its tables in playing order.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        town:
          type: string
          maxLength: 80
        address:
          type: string
          maxLength: 200
        active:
          type: boolean
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
          readOnly: true
      required:
      - active
      - address
      - id
      - name
      - tables
      - town
    VenueRequest:
      type: object
      description: A venue with its tables in playing order.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        town:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: string
          maxLength: 200
        active:
          type: boolean
      required:
      - name
      - town
    VenueSummary:
      type: object
      description: What anyone who can see a tournament sees of its venue.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        town:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
      required:
      - address
      - id
      - name
      - town
    ApiError:
      type: object
      description: Envelope of every API error (REQ-032); see core.exceptions.api_exception_handler.
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `validation_error`
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field messages for validation errors; empty otherwise
        request_id:
          type: string
          nullable: true
      required:
      - code
      - fields
      - message
      - request_id
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
