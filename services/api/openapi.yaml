  /api/v1/coaches/:
    get:
      operationId: coaches_list
      description: 'GET /coaches/: coaches taking players, filtered by name, town,
        region or a skill they teach.'
      parameters:
      - in: query
        name: level
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Name, headline or town
      - in: query
        name: skill
        schema:
          type: string
      tags:
      - coaches
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoachProfileList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
