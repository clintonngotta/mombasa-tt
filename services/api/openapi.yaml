              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/organizations/{organization_pk}/join-requests/{id}/reject/:
    post:
      operationId: organizations_join_requests_reject_create
      description: |-
        Join requests for one organization (REQ-004). Any signed-in player can ask to join; only
        active admins of that organization can list or decide requests (TASK-013 replaces this check
        with real permissions). Routes are mapped explicitly in urls.py.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: organization_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/organizations/{id}/:
    get:
      operationId: organizations_retrieve
      description: Search, view and register organizations (REQ-004).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization.
        required: true
      tags:
      - organizations
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/players/:
    get:
      operationId: players_list
      description: |-
        Opted-in players only (REQ-006). Searching needs at least two characters so the
        directory can't be dumped with an empty query.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name or nickname
      tags:
      - players
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDirectoryPlayerList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/players/{id}/:
    get:
      operationId: players_retrieve
      description: One listed player's page. 404 once they opt out, so opting out
        removes the page too.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - players
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    DirectoryPlayer:
      type: object
      description: 'Public directory card: name and organizations only. No email,
        bio, location or other details.'
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        nickname:
          type: string
        clubs:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - clubs
      - display_name
      - id
      - nickname
    EmailOnlyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ExperienceEnum:
      enum:
      - new
      - casual
      - club
      - competitive
      type: string
      description: |-
        * `new` - New
        * `casual` - Casual
        * `club` - Club
        * `competitive` - Competitive
    FormatEnum:
      enum:
      - singles
      - doubles
      type: string
      description: |-
        * `singles` - Singles
        * `doubles` - Doubles
    Game:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    GameRequest:
      type: object
      properties:
        my_points:
          type: integer
          maximum: 99
          minimum: 0
        opponent_points:
          type: integer
          maximum: 99
          minimum: 0
      required:
      - my_points
      - opponent_points
    Goals:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalsEnum'
          maxItems: 6
      required:
      - goals
    GoalsEnum:
      enum:
      - compete
      - rating
      - train
      - find_club
      - umpire
      - organize
      type: string
      description: |-
        * `compete` - Compete
        * `rating` - Rating
        * `train` - Train
        * `find_club` - Find Club
        * `umpire` - Umpire
        * `organize` - Organize
    GoalsRequest:
      type: object
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalsEnum'
          maxItems: 6
      required:
      - goals
    GripEnum:
      enum:
      - shakehand
      - penhold
      - other
      type: string
      description: |-
        * `shakehand` - Shakehand
        * `penhold` - Penhold
        * `other` - Other
    HandEnum:
      enum:
      - right
      - left
      type: string
      description: |-
        * `right` - Right
        * `left` - Left
    Invitation:
      type: object
      description: Staff view of an invitation they sent.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - decided_at
      - email
      - expires_at
      - id
      - status
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    InvitationStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      - revoked
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `declined` - Declined
        * `revoked` - Revoked
    JoinRequest:
      type: object
      description: Staff view of a request. Shows the requester's display name only,
        never their email.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/JoinRequestStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - decided_at
      - display_name
      - id
      - status
      - user
    JoinRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    KindEnum:
      enum:
      - club
      - facility
      - club_facility
      type: string
      description: |-
        * `club` - Club
        * `facility` - Facility
        * `club_facility` - Club Facility
    LabelTally:
      type: object
      properties:
        label:
          type: string
        played:
          type: integer
        won:
          type: integer
        lost:
          type: integer
      required:
      - label
      - lost
      - played
      - won
    LogInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    MatchLabels:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
      required:
      - labels
    MatchResultEnum:
      enum:
      - win
      - loss
      - draw
      type: string
      description: |-
        * `win` - Win
        * `loss` - Loss
        * `draw` - Draw
    MatchStats:
      type: object
      properties:
        played:
          type: integer
        won:
          type: integer
        lost:
          type: integer
        drawn:
          type: integer
        win_rate:
          type: number
          format: double
          nullable: true
        games_won:
          type: integer
        games_lost:
          type: integer
        recent_form:
          type: array
          items:
            $ref: '#/components/schemas/MatchResultEnum'
        by_label:
          type: array
