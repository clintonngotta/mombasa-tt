        TT and elsewhere.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Events still on from this day (calendar view)
      - in: query
        name: host
        schema:
          type: string
        description: The host or submitting club's id
      - in: query
        name: ours
        schema:
          type: boolean
        description: Only the caller's clubs
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Events starting by this day
      - in: query
        name: town
        schema:
          type: string
      - in: query
        name: when
        schema:
          type: string
          enum:
          - past
          - upcoming
      tags:
      - events
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListedEvent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
