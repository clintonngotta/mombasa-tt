components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        match_stake:
          type: boolean
          default: false
    AcceptedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        event: {}
        device_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        received_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - device_time
      - event
      - id
      - received_at
      - sequence
    Activity:
      type: object
      description: |-
        One part of a session's running order: a warm-up, a drill on the table, work off it, match play or
        the cool-down. A drill fills in the title when none is given.
      properties:
        phase:
          $ref: '#/components/schemas/PhaseEnum'
        title:
          type: string
          maxLength: 80
        minutes:
          type: integer
          maximum: 240
          minimum: 1
          nullable: true
        drill:
          type: string
          format: uuid
          nullable: true
      required:
      - drill
      - minutes
      - phase
      - title
    ActivityInvitees:
      type: object
      properties:
        invitee_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - invitee_ids
    ActivityRequest:
      type: object
      description: |-
        One part of a session's running order: a warm-up, a drill on the table, work off it, match play or
        the cool-down. A drill fills in the title when none is given.
      properties:
        phase:
          $ref: '#/components/schemas/PhaseEnum'
        title:
          type: string
          maxLength: 80
        minutes:
          type: integer
          maximum: 240
          minimum: 1
          nullable: true
        drill:
          type: string
          format: uuid
          nullable: true
      required:
      - phase
    ActivityStatusEnum:
      enum:
      - draft
      - published
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `cancelled` - Cancelled
    AdminHandover:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        kind:
          allOf:
          - $ref: '#/components/schemas/AdminHandoverKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdminHandoverStatusEnum'
          readOnly: true
          default: pending
        from_user:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        to_user:
          $ref: '#/components/schemas/Person'
        created_by:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - decided_at
      - from_user
      - id
      - kind
      - organization
      - reason
      - status
      - to_user
    AdminHandoverKindEnum:
      enum:
      - nomination
      - appointment
      type: string
      description: |-
        * `nomination` - Nomination
        * `appointment` - Appointment
    AdminHandoverStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      - cancelled
