        token:
          type: string
          minLength: 1
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - display_name
      - email
      - email_verified_at
      - id
    ApiError:
      type: object
      description: Envelope of every API error (REQ-032); see core.exceptions.api_exception_handler.
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `validation_error`
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field messages for validation errors; empty otherwise
        request_id:
          type: string
          nullable: true
      required:
      - code
      - fields
      - message
      - request_id
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
