[project]
name = "mombasa-tt-api"
version = "0.1.0"
description = "Coast TT Django API"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.5",
    "channels>=4.2",
    "channels-redis>=4.2",
    "cryptography>=45",
    "daphne>=4.1",
    "dj-database-url>=3.1.2",
    "django>=5.2,<6.1",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "pillow>=11",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
